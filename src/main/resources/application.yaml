cors:
  originPatterns: http://localhost:5173,http://localhost:5174,https://finance-pro-client-alpha.vercel.app
spring:
  application:
    name: financePro
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
security:
  jwt:
    token:
      secret-key: 57cr37
      expire-length: 3600000
mercadopago:
  access-token: ${MERCADO_PAGO_ACCESS_TOKEN}
  webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET}
  back-urls:
    success: ${APP_FRONTEND_URL}/checkout/success
    failure: ${APP_FRONTEND_URL}/checkout/failure
    pending: ${APP_FRONTEND_URL}/checkout/pending
  notification-url: ${APP_BACKEND_URL}/api/webhooks/mercadopago
logging:
  level:
    org.hibernate.stat: DEBUG