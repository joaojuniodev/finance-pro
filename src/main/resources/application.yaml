cors:
  originPatterns: http://localhost:5173,http://localhost:5174,https://finance-pro-client-alpha.vercel.app
spring:
  application:
    name: financePro
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
security:
  jwt:
    token:
      secret-key: 57cr37
      expire-length: 3600000